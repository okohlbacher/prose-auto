name: tests

# The tests read OpenMS test data (share/OpenMS/examples, src/tests/topp) from a sparse OpenMS checkout in openms/.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1" # Windows: the reports hold non-cp1252 characters (e.g. '≥')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OpenMS/OpenMS
          ref: dec18943e0faf6932a314a9bdf22796f74407a6b
          path: openms
          sparse-checkout: |
            share/OpenMS/examples/BSA
            share/OpenMS/examples/TOPPAS/data/BSA_Identification
            share/OpenMS/examples/TOPPAS/data/Identification
            src/tests/topp
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyopenms numpy pyyaml pytest
          python -m pip install -e .
      - name: Test
        run: python -m pytest tests -q
